<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2026 インターハイ・バドミントン 試合リンク集</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">2026 INTERHIGH · BADMINTON</p>
      <h1>試合リンク集</h1>
      <p>学校名、結果、スコアを確認して、BIRD SCOREまたは公式アーカイブを開けます。</p>
      <nav class="source-links" aria-label="関連リンク">
        <a href="https://www.birdscore.live/web/interhigh-2026-wakayama-team/" target="_blank" rel="noreferrer">BIRD SCORE 団体</a>
        <a href="https://www.birdscore.live/web/interhigh-2026-wakayama-Individual/" target="_blank" rel="noreferrer">BIRD SCORE 個人</a>
        <a href="extension.html">拡張機能の導入</a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="controls-panel" aria-labelledby="filters-heading">
        <div class="section-heading">
          <h2 id="filters-heading">試合を探す</h2>
          <p id="result-summary" class="result-summary">読み込み中…</p>
        </div>
        <div class="filters">
          <label>種別<select id="type-filter">
            <option value="all">すべて（団体・個人）</option>
            <option value="team">団体</option>
            <option value="individual">個人</option>
          </select></label>
          <label>種目<select id="category-filter">
            <option value="all">すべて（男女・単複）</option>
          </select></label>
          <label>日付<select id="date-filter">
            <option value="all">すべて</option>
          </select></label>
          <label>コート<select id="court-filter">
            <option value="all">すべて</option>
          </select></label>
          <label class="search-field">学校名・選手名<input id="search-filter" type="search" placeholder="例：東大阪大学柏原" /></label>
          <label class="checkbox-field"><input id="available-only" type="checkbox" />動画リンクありだけ</label>
          <button id="reset-filters" class="reset-button" type="button">全試合を表示</button>
        </div>
      </section>

      <section id="matches" class="match-list" aria-live="polite">
        <p class="loading-state">読み込み中…</p>
      </section>
    </main>

    <footer class="site-footer">
      <p id="generated-at">データ生成日時を読み込み中…</p>
      <a href="extension.html">拡張機能の導入</a>
    </footer>
    <script src="app.js" type="module"></script>
  </body>
</html>
